<style>
:root {
  --black: #0a0a0c;
  --white: #fafafa;
  --accent: #ff3366;
  --gray: #888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--black);
  color: var(--white);
  overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
header {
  position: relative; z-index: 3;
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding: 1.1rem 66px .8rem 2rem; /* right side stays clear of the hamburger */
  border-bottom: 2px solid var(--accent);
  background: rgba(10,10,12,.85);
}
h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: .12em; line-height: 1; font-weight: 400; }
h1 em { font-style: normal; color: var(--accent); }
/* the hamburger: one quiet door to contact + environment, instead of pills all over the screen */
#menu { position: fixed; top: 10px; right: 12px; z-index: 8; }
#menubtn {
  width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  font: inherit; font-size: 1.05rem; line-height: 1; cursor: pointer;
  color: var(--white); background: rgba(12,12,15,.72); backdrop-filter: blur(4px);
  border: 1px solid #333; border-radius: 999px; transition: all .2s;
}
#menubtn:hover, #menu.open #menubtn { border-color: var(--accent); color: var(--accent); }
#menudrop { display: none; position: absolute; right: 0; top: 50px; flex-direction: column; gap: .45rem; white-space: nowrap; }
#menu.open #menudrop { display: flex; }
#menudrop a, #menudrop button {
  font: inherit; font-size: .56rem; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; text-align: center;
  color: var(--white); background: rgba(12,12,15,.85); backdrop-filter: blur(6px); text-decoration: none;
  border: 1px solid #333; border-radius: 999px; padding: .55rem 1.05rem; transition: all .2s;
}
#menudrop a:hover, #menudrop button:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(255,51,102,.25); }

main { position: relative; z-index: 4; flex: 1; min-height: 0; } /* above the footer, so the bottom sheet paints (and clicks) over it */
#scene { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

/* now-playing panel: right dock on desktop, bottom sheet on phones */
#panel {
  position: absolute; right: 16px; top: 14px; z-index: 5; width: 380px;
  max-height: calc(100% - 28px); overflow-y: auto; /* never taller than the cabin it floats in */
  display: none; flex-direction: column; gap: .55rem;
  background: rgba(12,12,15,.82); backdrop-filter: blur(8px);
  border: 1px solid #26262e; border-radius: 14px; padding: .9rem;
}
#panel.on { display: flex; } /* the panel only exists while a station is on */
#np-head { display: flex; align-items: center; justify-content: space-between; gap: .7rem; cursor: pointer; }
#np-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.25rem; letter-spacing: .1em; line-height: 1.05; min-height: 1.2rem; }
#np-credit { font-size: .52rem; letter-spacing: .16em; color: var(--gray); text-transform: uppercase; margin-top: .15rem; }
#np-chevron { display: none; color: var(--gray); font-size: .8rem; transition: transform .35s; padding: .3rem; }
#embed { width: 100%; height: 152px; border-radius: 10px; overflow: hidden; transition: height .3s; }
#embed:empty { display: none; }
#embed iframe { display: block; width: 100%; height: 100%; border: 0; }
#np-actions { display: flex; gap: .45rem; align-items: stretch; }
#np-actions button {
  font: inherit; font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
  color: var(--white); background: none; border: 1px solid #3a3a42; border-radius: 999px; padding: .5rem .9rem; transition: all .2s;
}
#np-actions button:hover { border-color: var(--accent); color: var(--accent); }
#np-actions .grow { flex: 1; }
/* ✕ out of a locked camera — back to the cabin */
#closeview {
  position: fixed; right: 16px; top: 84px; z-index: 6;
  width: 42px; height: 42px; display: none; align-items: center; justify-content: center;
  font: inherit; font-size: .85rem; line-height: 1; cursor: pointer;
  color: var(--white); background: rgba(12,12,15,.72); backdrop-filter: blur(4px);
  border: 1px solid #333; border-radius: 999px; transition: all .2s;
}
#closeview:hover { border-color: var(--accent); color: var(--accent); }
body[data-mode="radio"] #closeview { display: flex; }
@media (min-width: 721px) {
  body[data-mode="radio"] #closeview { right: 412px; } /* clear of the docked panel */
}
body[data-mode="radio"] #browse { display: none; }
/* browse bar: surf the stations without touching the 3d */
#browse {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 6;
  display: flex; gap: .5rem;
}
#browse button {
  font: inherit; font-size: .85rem; line-height: 1; cursor: pointer;
  width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--white); background: rgba(12,12,15,.72); backdrop-filter: blur(4px);
  border: 1px solid #333; border-radius: 999px; transition: all .2s;
}
#browse button:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(255,51,102,.25); }

footer { position: relative; z-index: 3; text-align: center; font-size: .52rem; letter-spacing: .22em; color: #55525c; padding: .5rem 1rem .7rem; text-transform: uppercase; background: rgba(10,10,12,.85); }
footer a { color: #8a8792; text-decoration: none; }
footer a:hover { color: var(--accent); }

#fail { position: absolute; inset: 0; z-index: 4; display: none; align-items: center; justify-content: center; text-align: center;
  font-size: .7rem; letter-spacing: .12em; line-height: 2; color: var(--gray); padding: 2rem; }
#fail a { color: var(--accent); }

/* landscape phones are wide enough to read as "desktop" — size the dock by height too,
   or the full album embed marches straight off the bottom of the screen */
@media (min-width: 721px) and (max-height: 540px) {
  #panel { width: 300px; top: 10px; right: 10px; max-height: calc(100% - 20px); padding: .7rem; gap: .45rem; }
  #np-title { font-size: 1.05rem; }
  body[data-mode="radio"] #closeview { right: 322px; } /* clear of the slimmer dock */
}

@media (max-width: 720px) {
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto;
    border-radius: 16px 16px 0 0; border-left: none; border-right: none; border-bottom: none;
    padding: .65rem .9rem calc(.65rem + env(safe-area-inset-bottom));
    transition: transform .35s ease;
  }
  #panel.min { transform: translateY(calc(100% - 62px)); } /* slide down to a mini bar; the iframe stays alive */
  #panel.min #np-chevron { transform: rotate(180deg); }
  #np-chevron { display: block; }
  #np-title { font-size: 1.1rem; }
  #panel.on ~ #browse { bottom: 76px; } /* a station is on — the mini bar owns the very bottom */
  #closeview { right: 10px; top: 82px; }
  header { padding: .9rem 62px .65rem 1.1rem; }

/* every record is a station on the dial, spread across the fm band */
const FM_LO = 87.9, FM_HI = 107.9;
const freqOf = (i) => FM_LO + (i / (N - 1)) * (FM_HI - FM_LO);
const stationAt = (f) => Math.max(0, Math.min(N - 1, Math.round((f - FM_LO) / (FM_HI - FM_LO) * (N - 1))));
const PRESETS = [0, 5, 10, 15, 20, 25]; // six saved stations, spread across the band

/* ---- spotify: a fresh controller per station — the wall's proven pattern ----
   never loadUri a live embed: on phones the load gets swallowed and the creation
   record sticks (the "born to be" bug). destroy + recreate with the right uri,
   created inside the tap; play() rides the embed's ready event */
let IFA = null, controller = null, wantPlay = false;
let paused = true, progress = 0, posMs = 0, posAt = 0;
window.onSpotifyIframeApiReady = (api) => { IFA = api; };

  const embed = document.getElementById("embed");
  if (controller) { try { controller.destroy(); } catch (e) {} controller = null; }
  embed.innerHTML = "";
  if (!IFA) { // api blocked — plain embed; the dash still lights up to its own start/stop
    embed.innerHTML =
      `<iframe src="https://open.spotify.com/embed/${w.kind}/${w.id}?theme=0" loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    return;
  }
  wantPlay = true; // stays set until playback_update confirms audio — every chance to start it gets taken
  const host = document.createElement("div");
  embed.appendChild(host);
  IFA.createController(host, { uri: `spotify:${w.kind}:${w.id}`, width: "100%", height: "100%" }, (c) => {
    controller = c;
    c.addListener("ready", () => { if (wantPlay) c.play(); });
    c.addListener("playback_update", (e) => {
      paused = !!e.data.isPaused;
      if (!paused) wantPlay = false; // it's actually playing — stand down, respect a manual pause from here
      document.getElementById("bplay").textContent = paused ? "▶" : "❚❚";
      if (e.data.duration) progress = e.data.position / e.data.duration;
      posMs = e.data.position; posAt = performance.now(); // the whole cabin phase-locks to this
      screenDirty = true;
    });
  });
}

/* ---- a little webaudio: dial static + the horn. no files, gesture-gated ---- */
let AC = null, staticGain = null, vol = 0.8;
function audioUp() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const master = AC.createDynamicsCompressor(); master.connect(AC.destination);
  const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const filt = AC.createBiquadFilter(); filt.type = "bandpass"; filt.frequency.value = 2200; filt.Q.value = 0.5;
  staticGain = AC.createGain(); staticGain.gain.value = 0;
  src.connect(filt); filt.connect(staticGain); staticGain.connect(master);
  src.start();
  AC._master = master;
}
function setStatic(on) {
  if (!staticGain) return;
  const t = AC.currentTime;
  staticGain.gain.cancelScheduledValues(t);
  staticGain.gain.setValueAtTime(staticGain.gain.value, t);
  staticGain.gain.linearRampToValueAtTime(on ? 0.05 * vol : 0, t + 0.06);
}
function honk() {
  audioUp();
  const t = AC.currentTime + 0.005;
  const g = AC.createGain(); g.connect(AC._master);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.16 * vol, t + 0.015);
  g.gain.setValueAtTime(0.16 * vol, t + 0.3);
  g.gain.linearRampToValueAtTime(0, t + 0.42);
  for (const f of [345, 440]) {
    const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
    const og = AC.createGain(); og.gain.value = 0.5;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.45);
  }
}

  const g = screenTex.getContext();
  g.fillStyle = "#05070b"; g.fillRect(0, 0, 512, 256);

  if (!powered) {
    g.fillStyle = "rgba(200,206,220,0.16)";

    g.fillText("METRO FM", 256, 106);

    g.fillText("· tap to tune ·", 256, 168);

    g.fillStyle = "#e9edf6"; g.font = "600 92px 'IBM Plex Mono', monospace"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(freq.toFixed(1), 256, 92);
    g.font = "600 26px 'IBM Plex Mono', monospace"; g.fillStyle = "#8a90a2";
    g.fillText("FM", 256, 150);
    const near = stationAt(freq);
    if (Math.abs(freqOf(near) - freq) < 0.5) {
      g.fillStyle = "rgba(255,51,102,0.85)";
      g.fillText(WORKS[near].title.toUpperCase().slice(0, 26), 256, 190);
    }
    for (let i = 0; i < 60; i++) { // static
      g.fillStyle = `rgba(255,255,255,${Math.random() * 0.14})`;
      g.fillRect(Math.random() * 512, 212 + Math.random() * 40, 3 + Math.random() * 14, 2);
    }

    return;
  }
  const w = WORKS[current];
  const img = artImg(w);
  if (img) g.drawImage(img, 16, 58, 140, 140);
  else { g.fillStyle = "#151722"; g.fillRect(16, 58, 140, 140); }
  g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillStyle = "#ff3366"; g.font = "600 34px 'IBM Plex Mono', monospace";
  g.fillText(freqOf(current).toFixed(1) + " FM", 16, 42);
  g.fillStyle = "#8a90a2"; g.font = "600 20px 'IBM Plex Mono', monospace";
  g.fillText(paused ? "◦ TUNED" : "● ON AIR", 380, 42);
  /* marquee title: long names take a slow lap */
  g.font = "600 40px 'IBM Plex Mono', monospace"; g.fillStyle = "#e9edf6";
  const title = w.title.toUpperCase();
  const tw = g.measureText(title).width, maxW = 320;
  g.save(); g.beginPath(); g.rect(172, 66, maxW, 52); g.clip();
  if (tw <= maxW) g.fillText(title, 172, 104);
  else {
    const off = (roomT * 55) % (tw + 90);
    g.fillText(title, 172 - off, 104); g.fillText(title, 172 - off + tw + 90, 104);
  }

  g.fillStyle = "#6a7082"; g.font = "600 17px 'IBM Plex Mono', monospace";
  g.fillText(w.credit.toUpperCase().slice(0, 34), 172, 142);

  const bars = 16;
  for (let i = 0; i < bars; i++) {

      Math.abs(Math.sin(beat * Math.PI + i * 0.85)) * (0.3 + 0.7 * kick) * (0.5 + 0.5 * Math.sin(i * 2.3 + beat * 2)));

function embedH(w) {
  // full album embed (tracklist) only when there's room for it — short screens get spotify's compact player
  return (w.kind === "album" && window.innerHeight > 540) ? 352 : 152;
}

  if (current >= 0) document.getElementById("embed").style.height = embedH(WORKS[current]) + "px";
});

function chooseStation(i) {
  i = ((i % N) + N) % N;
  if (i === current) { if (paused && controller) try { controller.play(); } catch (e) {} return; }
  const w = WORKS[i];
  current = i; lastStation = i; freq = freqOf(i);
  beatPos = 0; posAt = 0; // fresh beat grid for the new station
  ensureController(w); // fresh player built inside the tap — play() rides its ready event
  npTitle.textContent = w.title;
  npCredit.textContent = w.credit;
  document.getElementById("embed").style.height = embedH(w) + "px";
  panel.classList.add("on"); panel.classList.remove("min");
  progress = 0; screenDirty = true;
  tuneKnob.rotation.z -= 0.9; // the knob remembers being turned
  if (mode !== "radio") enterRadio();
}
function powerToggle() {
  if (current < 0) { chooseStation(lastStation); return; }
  if (controller) { if (wantPlay) controller.play(); else controller.togglePlay(); }
}
function powerOff() {
  if (current < 0) return;
  current = -1;
  wantPlay = false; // switched off on purpose — don't resurrect it on the next touch
  if (controller) try { controller.pause(); } catch (e) {}
  paused = true; progress = 0;
  bplay.textContent = "▶";
  panel.classList.remove("on");
  screenDirty = true;

}

/* ---- picking: taps for buttons, drags for the knobs ---- */
let bobbleKick = 0, hornFlash = 0;
scene.onPointerObservable.add((pi) => {
  const pick = pi.pickInfo;
  if (pi.type === B.PointerEventTypes.POINTERDOWN) {
    const ctl = pick?.hit && pick.pickedMesh?.metadata?.ctl;
    if (ctl === "tuneknob") {
      tuneDrag = { x: scene.pointerX, f0: freq, moved: false };
      cam.detachControl(); audioUp();
    }
    if (ctl === "volknob") {
      volDrag = { x: scene.pointerX, v0: vol, moved: false };
      cam.detachControl();
    }
    if (!ctl && pick?.hit && pick.pickedMesh?.metadata?.drag) { // grab a fitting
      itemDrag = DRAGS[pick.pickedMesh.metadata.drag];
      cam.detachControl();
    }
  }
  if (pi.type === B.PointerEventTypes.POINTERMOVE) {
    if (itemDrag) { // slide the fitting along its plane
      const clampTo = (v, r) => Math.max(r[0], Math.min(r[1], v));
      const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, B.Matrix.Identity(), cam);
      const n = itemDrag.node, lim = itemDrag.lim;
      if (itemDrag.mode === "wall") {
        if (Math.abs(ray.direction.z) > 1e-4) {
          const t = (n.position.z - ray.origin.z) / ray.direction.z;
          if (t > 0) {
            n.position.x = clampTo(ray.origin.x + ray.direction.x * t, lim.x);
            n.position.y = clampTo(ray.origin.y + ray.direction.y * t, lim.y);
          }
        }
      } else {
        if (Math.abs(ray.direction.y) > 1e-4) {
          const t = (n.position.y - ray.origin.y) / ray.direction.y;
          if (t > 0) {
            n.position.x = clampTo(ray.origin.x + ray.direction.x * t, lim.x);
            n.position.z = clampTo(ray.origin.z + ray.direction.z * t, lim.z);
          }
        }
      }
      return;
    }
    if (tuneDrag) {
      const dx = scene.pointerX - tuneDrag.x;
      if (Math.abs(dx) > 4) tuneDrag.moved = true;
      if (tuneDrag.moved) {
        freq = Math.max(FM_LO, Math.min(FM_HI, tuneDrag.f0 + dx * 0.012));
        tuneKnob.rotation.z = -(freq - FM_LO) * 1.1;
        setStatic(true);
      }
      return;
    }
    if (volDrag) {
      const dx = scene.pointerX - volDrag.x;
      if (Math.abs(dx) > 4) volDrag.moved = true;
      if (volDrag.moved) {
        vol = Math.max(0, Math.min(1, volDrag.v0 + dx * 0.004));
        volKnob.rotation.z = (vol - 0.5) * 4;
      }
      return;
    }
  }
  if (pi.type === B.PointerEventTypes.POINTERUP) {
    if (itemDrag) {
      itemDrag = null;
      saveLayout(); // the arrangement survives the reload
      if (mode === "cabin") cam.attachControl(document.getElementById("scene"), true);
    }
    if (tuneDrag) {
      const moved = tuneDrag.moved;
      tuneDrag = null; setStatic(false); screenDirty = true;
      if (moved) chooseStation(stationAt(freq)); // let go of the dial — the nearest station grabs it
      if (mode === "cabin") cam.attachControl(document.getElementById("scene"), true);
    }
    if (volDrag) {
      volDrag = null;
      if (mode === "cabin") cam.attachControl(document.getElementById("scene"), true);
    }
  }
  if (pi.type === B.PointerEventTypes.POINTERTAP && pick?.hit && pick.pickedMesh?.metadata) {
    const md = pick.pickedMesh.metadata;
    if ((md.ctl === "radio" || md.ctl === "screen") && mode !== "radio") { enterRadio(); return; } // first tap leans you in
    if (md.ctl === "screen") powerToggle(); // it's a touchscreen, after all
    if (md.ctl === "radio" && current < 0) powerToggle(); // tap the dark unit = wake it up
    if (md.ctl === "preset") chooseStation(PRESETS[md.k]);
    if (md.ctl === "volknob") powerToggle();
    if (md.ctl === "tuneknob") { if (current >= 0) chooseStation(current + 1); else chooseStation(stationAt(freq)); }
    if (md.ctl === "horn") { honk(); bobbleKick = 2.4; hornFlash = 1; }
  }
});

/* ---- browse bar + panel actions ---- */
function step(dir) { chooseStation(current >= 0 ? current + dir : lastStation + dir); }
document.getElementById("bprev").addEventListener("click", () => step(-1));
document.getElementById("bnext").addEventListener("click", () => step(1));
bplay.addEventListener("click", () => powerToggle());
document.getElementById("skipb").addEventListener("click", () => step(-1));
document.getElementById("skipf").addEventListener("click", () => step(1));
document.getElementById("dialb").addEventListener("click", () => enterRadio()); // lean back into the radio
document.getElementById("closeview").addEventListener("click", () => toCabin());
document.getElementById("np-head").addEventListener("click", () => {
  if (current < 0) return;
  if (panel.classList.contains("min")) enterRadio(); // the mini bar reopens onto the radio
  else toCabin();
});
window.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); powerToggle(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === "Escape") { if (mode === "radio") toCabin(); else powerOff(); }
});
const menuEl = document.getElementById("menu");
document.getElementById("menubtn").addEventListener("click", () => menuEl.classList.toggle("open"));
document.getElementById("menudrop").addEventListener("click", (e) => { if (e.target.id !== "copylayout") menuEl.classList.remove("open"); });
window.addEventListener("pointerdown", (e) => { if (!menuEl.contains(e.target)) menuEl.classList.remove("open"); }, true);
document.getElementById("resetlayout").addEventListener("click", () => {
  try { localStorage.removeItem(LAYOUT_KEY); } catch (e) {}
  location.reload();
});
document.getElementById("copylayout").addEventListener("click", (e) => {
  const done = () => { e.target.textContent = "copied ✓"; setTimeout(() => { e.target.textContent = "⧉ copy layout"; }, 1400); };
  const txt = JSON.stringify(layoutSnapshot(), null, 1);
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done, done); else done();
});

/* ---- the loop: the road, the sway, the beat ---- */
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let roomT = 0, partyAmt = 0, beatPos = 0;
let bumpY = 0, bumpV = 0, nextBump = 1.6;
let treeA = 0, treeV = 0, nod = 0, nodV = 0, lastBeatInt = -1;
let washZ = 6, frameCount = 0;
scene.onBeforeRenderObservable.add(() => {
  const dt = Math.min(0.05, engine.getDeltaTime() / 1000);
  roomT += dt; frameCount++;

  // the camera glides between its moods
  if (camAnim.on) {
    camAnim.t += dt;
    const k = ease(Math.min(1, camAnim.t / camAnim.dur));
    const f = camAnim.from, v = camAnim.to;
    cam.alpha = f.alpha + (v.alpha - f.alpha) * k;
    cam.beta = f.beta + (v.beta - f.beta) * k;
    cam.radius = f.radius + (v.radius - f.radius) * k;
    cam.target.copyFrom(B.Vector3.Lerp(f.target, v.target, k)); // mutate in place — the target SETTER would recompute alpha/beta/radius and fight us
    cam.targetScreenOffset.set(f.ox + (v.ox - f.ox) * k, f.oy + (v.oy - f.oy) * k);
    if (camAnim.t >= camAnim.dur) {
      camAnim.on = false;
      if (camAnim.thenAttach) { cabinLimits(); cam.attachControl(document.getElementById("scene"), true); }
    }
  }

  const playing = current >= 0 && !paused;

  // the show eases in while a station plays, phase-locked to playback position
  partyAmt += ((playing ? 1 : 0) - partyAmt) * Math.min(1, dt * 1.8);
  if (playing) {
    if (controller && posAt) beatPos = (posMs + performance.now() - posAt) / 1000;
    else beatPos += dt; // plain-embed fallback free-runs the grid
  }
  const bpm = 120;
  const beat = beatPos * bpm / 60;
  const kick = Math.pow(Math.max(0, 1 - (beat % 1)), 2.4);        // hits on the beat, decays fast
  const off = Math.pow(Math.max(0, 1 - ((beat + 0.5) % 1)), 2.4); // the offbeat answer
  const bar = Math.floor(beat / 4);

  // the drive: the world streams past; the music leans on the gas
  const speed = 9 + 5 * partyAmt + Math.sin(roomT * 0.23) * 0.8;
  roadM.diffuseTexture.vOffset -= speed * dt / 20; // 8 tiles over 160 m → one v per 20 m
  for (const o of outside) {
    o.node.position.z -= speed * dt;
    if (o.node.position.z < o.min) o.node.position.z += o.span;
  }
  carAhead.position.z = 24 + Math.sin(roomT * 0.11) * 5;
  carAhead.position.x = 0.1 + Math.sin(roomT * 0.4) * 0.15;
  oncoming.position.z -= (speed + 13) * dt;
  if (oncoming.position.z < -10) oncoming.position.z = 90 + ((bar * 7) % 3) * 45 + Math.random() * 30;
  headLight.position.set(-4.2, 0.4, oncoming.position.z - 2);
  headLight.intensity = 1.7 * Math.exp(-Math.pow((oncoming.position.z - 2) / 7, 2)); // brightest as it passes

  // the sodium wash rolls through on the lamp rhythm
  washZ -= speed * dt;
  if (washZ < -5) washZ += 14;
  streetWash.position.set(washZ > 0 ? 2.4 : -2.4, 2.7, washZ); // alternate sides like the lamps do
  streetWash.intensity = 0.9 * Math.exp(-Math.pow(washZ / 4.5, 2));

  // the road talks back: idle vibration + the occasional seam
  nextBump -= dt;
  if (nextBump <= 0) { bumpV -= 0.05 + Math.random() * 0.09; treeV += (Math.random() - 0.3) * 0.8; nextBump = 1.2 + Math.random() * 2.4; }
  bumpV += (-60 * bumpY - 8 * bumpV) * dt;
  bumpY += bumpV * dt;
  cab.position.y = bumpY + Math.sin(roomT * 21) * 0.0022 + Math.sin(roomT * 34) * 0.0012;
  cab.rotation.z = Math.sin(roomT * 0.6) * 0.006 + bumpV * 0.04;
  cab.rotation.x = bumpV * 0.05;

  // the tree swings on its string, feeling every seam
  treeV += (-16 * treeA - 1.4 * treeV) * dt + Math.sin(roomT * 1.7) * 0.06 * dt * 60 * 0.02;
  treeA += treeV * dt;
  treeRoot.rotation.z = treeA + cab.rotation.z * 2;
  treeRoot.rotation.x = Math.sin(roomT * 1.1) * 0.05;

  // the bobblehead keeps time (and panics at the horn)
  if (playing) { const bi = Math.floor(beat); if (bi !== lastBeatInt) { lastBeatInt = bi; nodV -= 1.1 + 0.6 * Math.random(); } }
  if (bobbleKick > 0) { nodV -= bobbleKick; bobbleKick = 0; }
  nodV += (-46 * nod - 4.5 * nodV) * dt;
  nod += nodV * dt;
  bobbleHead.rotation.x = nod * 0.35;
  bobbleHead.rotation.z = nod * 0.12;
  bobbleHead.position.y = 0.115 + Math.abs(nod) * 0.008;

  // hands-free micro-steering, because somebody's driving
  wheelRoot.rotation.y = Math.sin(roomT * 0.5) * 0.05 + bumpV * 0.15;

  // needles: speed rides the drive, the tach rides the kick
  speedNeedle.rotation.z = 2.1 - (speed / 22) * 2.6 + Math.sin(roomT * 9) * 0.015;
  tachNeedle.rotation.z = 2.1 - (0.32 + 0.25 * partyAmt + 0.3 * kick * partyAmt) * 2.6;

  // the light show, cabin edition
  if (partyAmt > 0.01) {
    neonA.diffuse = B.Color3.FromHSV((bar * 47) % 360, 0.85, 1);
    neonB.diffuse = B.Color3.FromHSV((bar * 47 + 160) % 360, 0.85, 1);
    neonA.intensity = partyAmt * vol * (0.1 + 0.9 * kick);
    neonB.intensity = partyAmt * vol * (0.1 + 0.9 * off);
    stripM.emissiveColor = ACCENT.scale(0.35 + 1.4 * kick * partyAmt);
    glow.intensity = 0.55 + partyAmt * 0.4 * kick;
    subCone.position.z = 0.24 + 0.03 * kick * partyAmt * vol;
    subCone.scaling.setAll(1 + 0.1 * kick * partyAmt * vol);
  } else {
    neonA.intensity = 0; neonB.intensity = 0;
    stripM.emissiveColor = ACCENT.scale(current >= 0 ? 0.4 : 0.12);
    glow.intensity = 0.55;
    subCone.position.z = 0.24; subCone.scaling.setAll(1);
  }
  if (hornFlash > 0) { hornFlash = Math.max(0, hornFlash - dt * 3); neonA.intensity = Math.max(neonA.intensity, hornFlash); neonA.diffuse = B.Color3.White(); }
  dashGlow.intensity = 0.5 - 0.15 * partyAmt;

  // the screen keeps up (every other frame is plenty)
  if ((playing || tuneDrag || screenDirty) && frameCount % 2 === 0) {
    drawScreen(beat, kick * partyAmt);
    screenDirty = false;
  }
});
engine.runRenderLoop(() => scene.render());
function frameCamera() { // portrait keeps the vertical fov — reframe whatever we're looking at
  if (mode === "cabin") {
    const v = viewCabin();
    cam.beta = v.beta; cam.radius = v.radius; cam.target.copyFrom(v.target); cam.targetScreenOffset.set(v.ox, v.oy);
  } else if (mode === "radio") camTo(viewRadio(), 0.4);
}
frameCamera();
window.addEventListener("resize", () => { engine.resize(); frameCamera(); });

/* debug hooks, same spirit as the deck */
window.METRO_CAR = { scene, engine, cam, chooseStation, powerToggle, powerOff, step, enterRadio, toCabin, honk,
  DRAGS, layoutSnapshot,
  demo: (on) => { if (current < 0) current = 0; paused = !on; screenDirty = true; }, // pretend playback for testing the show without audio
  get state() { return { current, freq, vol, paused, progress, mode, partyAmt }; } };
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
