<style>
:root {
  --black: #0a0a0c;
  --white: #fafafa;
  --accent: #ff3366;
  --gray: #888;
  --plat-hi: #e8ecf2; --plat-lo: #9aa2ae;
  --gold-hi: #f0d98a; --gold-lo: #a97e2f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--black);
  color: var(--white);
  overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}
/* the wall: dark plaster + a soft gallery spotlight + faint scanlines (the old page's texture) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,.085) 0%, transparent 60%),
    radial-gradient(80% 60% at 50% 110%, rgba(255,51,102,.05) 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(250,250,250,.012) 2px, rgba(250,250,250,.012) 4px);
}
header {
  position: relative; z-index: 2;
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding: 1.6rem 2rem 1.2rem;
  border-bottom: 2px solid var(--accent);
}
h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.6rem, 4.5vw, 2.6rem); letter-spacing: .12em; line-height: 1; font-weight: 400; }
h1 em { font-style: normal; color: var(--accent); }
.sub { font-size: .6rem; letter-spacing: .3em; color: var(--gray); text-transform: uppercase; }
.ig { font-size: .66rem; letter-spacing: .14em; color: var(--white); text-decoration: none;
  border: 1px solid #333; border-radius: 999px; padding: .5rem 1rem; white-space: nowrap; transition: all .2s; }
.ig:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(255,51,102,.25); }

/* ------ the rail of plaques ------ */
main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
#rail {
  display: flex; align-items: center; gap: clamp(1.2rem, 4vw, 3rem);
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  padding: 3vh calc(50vw - min(39vw, 210px, 25vh));  /* half a plaque, so first & last can center */
  scrollbar-width: none; -ms-overflow-style: none;
  cursor: grab;
}
#rail::-webkit-scrollbar { display: none; }
#rail.dragging { scroll-snap-type: none; cursor: grabbing; }
.slot { scroll-snap-align: center; flex: 0 0 auto; perspective: 1400px; }

/* ------ one plaque ------ */
.plaque {
  position: relative;
  width: min(78vw, 420px, 50vh);  /* 50vh*13/10 = 65vh tall — clears header+nav on short screens */
  aspect-ratio: 10 / 13;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.4,.1,.2,1);
}
.slot:nth-child(odd)  .plaque { rotate: .5deg; }
.slot:nth-child(even) .plaque { rotate: -.5deg; }
.slot.flipped .plaque { transform: rotateY(180deg); rotate: 0deg; }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 6px;
  /* the wooden frame */
  border: 12px solid transparent;
  background:
    linear-gradient(155deg, #191a1f 0%, #101014 55%, #1c1d23 100%) padding-box,
    linear-gradient(155deg, #4a4a52 0%, #232329 30%, #101013 60%, #3a3a42 100%) border-box;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.06),
    0 18px 40px rgba(0,0,0,.65),
    0 4px 10px rgba(0,0,0,.5);
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden;
}
/* glass over the front */
.face.front::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 28%, transparent 42%, transparent 75%, rgba(255,255,255,.05) 100%);
}
.face.back { transform: rotateY(180deg); justify-content: center; padding: 1.1rem; gap: .7rem; }

/* the record */
.disc {
  position: relative;
  width: 68%; aspect-ratio: 1; border-radius: 50%;
  margin-top: 9%;
  box-shadow: 0 10px 26px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.55);
}
.disc::before { /* metal + grooves */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.16) 0 1px, transparent 1px 4px),
    conic-gradient(from 210deg, var(--hi) 0%, var(--lo) 12%, var(--hi) 26%, var(--lo) 40%, #fdfdfd 50%, var(--lo) 62%, var(--hi) 76%, var(--lo) 90%, var(--hi) 100%);
}
.disc::after { /* soft dome light */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.35) 0%, transparent 45%);
  mix-blend-mode: soft-light;
}
.plaque .platinum { --hi: var(--plat-hi); --lo: var(--plat-lo); }
.plaque .gold     { --hi: var(--gold-hi); --lo: var(--gold-lo); }
.label {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 42%; aspect-ratio: 1; border-radius: 50%;
  background-size: cover; background-position: center;
  box-shadow: 0 0 0 3px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5);
  z-index: 1;
}
.label::after { /* spindle hole */
  content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 7%; aspect-ratio: 1; border-radius: 50%;
  background: #0a0a0c; box-shadow: 0 0 0 2px rgba(255,255,255,.25);
}

/* the engraved plate */
.plate {
  margin-top: auto; margin-bottom: 7%;
  width: 78%;
  padding: .6rem .8rem .55rem;
  text-align: center; border-radius: 3px;
  background: linear-gradient(170deg, var(--hi) 0%, var(--lo) 70%, var(--hi) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.5);
  color: #1c1a14;
}
.plate .title {
  font-family: 'Bebas Neue', sans-serif; font-size: clamp(.85rem, 2.6vw, 1.08rem); letter-spacing: .1em; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 0 rgba(255,255,255,.35);
}
.plate .cert {
  margin-top: .28rem; font-size: .5rem; letter-spacing: .22em; text-transform: uppercase; opacity: .78;
  text-shadow: 0 1px 0 rgba(255,255,255,.3);
}
.plate .by { margin-top: .18rem; font-size: .48rem; letter-spacing: .18em; text-transform: uppercase; opacity: .62; }

/* back face: the player */
.back .hint { font-size: .56rem; letter-spacing: .2em; color: var(--gray); text-transform: uppercase; }
.back .player { width: 100%; flex: 0 1 352px; min-height: 140px; border-radius: 12px; overflow: hidden; } /* 352 = spotify's full album embed; shrinks on short plaques, never stretches into dead space */
.back iframe { display: block; width: 100%; height: 100%; border: 0; }
.back .close {
  font: inherit; font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
  color: var(--white); background: none; border: 1px solid #3a3a42; border-radius: 999px; padding: .5rem 1.1rem; transition: all .2s;
}
.back .close:hover { border-color: var(--accent); color: var(--accent); }

/* ------ nav ------ */
nav {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: center; gap: 1.4rem;
  padding: .4rem 0 1.4rem;
}
nav button {
  font: inherit; font-size: 1rem; line-height: 1; cursor: pointer;
  color: var(--white); background: rgba(255,255,255,.04);
  border: 1px solid #333; border-radius: 999px; width: 2.6rem; height: 2.6rem; transition: all .2s;
}
nav button:hover { border-color: var(--accent); color: var(--accent); }
#counter { font-size: .66rem; letter-spacing: .3em; color: var(--gray); min-width: 5.5rem; text-align: center; }
#counter b { color: var(--white); font-weight: 600; }
footer { position: relative; z-index: 2; text-align: center; font-size: .52rem; letter-spacing: .22em; color: #55525c; padding: 0 1rem 1rem; text-transform: uppercase; }
footer a { color: #8a8792; text-decoration: none; }
footer a:hover { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .plaque { transition: none; }
  #rail { scroll-behavior: auto !important; }
}
@media (max-height: 600px) { .disc { margin-top: 5%; } header { padding: 1rem 1.2rem .8rem; } }
@media (max-width: 480px) {
  .plaque { width: min(88vw, 420px, 50vh); }              /* phones: the plaque fills more of the wall */
  #rail { padding: 3vh calc(50vw - min(44vw, 210px, 25vh)); } /* keep centering in sync with the wider plaque */
  .face.back { padding: .9rem .55rem; }                    /* spotify's embed needs ~260px to lay out right */
  .back .player { flex: 0 0 152px; min-height: 152px; }    /* narrow embeds render spotify's 152px compact layout — don't leave dead iframe below it */
}
</style>

/* ---- build the wall ---- */
const rail = document.getElementById("rail");
WORKS.forEach((w, i) => {
  const finish = w.kind === "album" ? "platinum" : "gold";
  const cert = w.kind === "album" ? "certified platinum · lp" : "certified gold · single";
  const slot = document.createElement("div");
  slot.className = "slot"; slot.dataset.i = i;
  slot.innerHTML = `
    <div class="plaque">
      <div class="face front">
        <div class="disc ${finish}"><div class="label" style="background-image:url('${w.art}')"></div></div>
        <div class="plate ${finish}">
          <div class="title">${w.title.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>
          <div class="cert">${cert}</div>
          <div class="by">mixed &amp; mastered by the metro</div>
        </div>
      </div>
      <div class="face back">
        <div class="hint">now spinning</div>
        <div class="player"></div>
        <button class="close">put it back</button>
      </div>
    </div>`;
  rail.appendChild(slot);
});
const slots = [...rail.children];
document.querySelector("#counter").innerHTML = `<b>01</b> / ${String(WORKS.length).padStart(2,"0")}`;

/* ---- flip to play (one player at a time, so audio never overlaps) ---- */
let open = null;
function unflip() {
  if (!open) return;
  open.classList.remove("flipped");
  const p = open.querySelector(".player"); setTimeout(() => { p.innerHTML = ""; }, 700); // let the flip finish, then kill the audio
  open = null;
}
function flip(slot) {
  if (open === slot) return unflip();
  unflip();
  const w = WORKS[slot.dataset.i];
  slot.querySelector(".player").innerHTML =
    `<iframe src="https://open.spotify.com/embed/${w.kind}/${w.id}?theme=0" loading="lazy"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="${w.title.replace(/"/g,"")}"></iframe>`;
  slot.classList.add("flipped");
  open = slot;
  center(+slot.dataset.i, true);
}
rail.addEventListener("click", (e) => {
  const slot = e.target.closest(".slot"); if (!slot || dragged) return;
  if (e.target.closest(".close")) return unflip();
  if (e.target.closest("iframe, .player")) return;
  flip(slot);
});

/* ---- the wall moves as a whole: native swipe (snap) + desktop drag + wheel + keys ---- */
let dragged = false;
let drag = null;
rail.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "mouse" || e.target.closest("iframe")) return; // touch gets native momentum scrolling
  drag = { x: e.clientX, left: rail.scrollLeft }; dragged = false;
  rail.classList.add("dragging"); rail.setPointerCapture(e.pointerId);
});
rail.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8) dragged = true;
  rail.scrollLeft = drag.left - dx;
});
function endDrag() {
  if (!drag) return;
  drag = null; rail.classList.remove("dragging");
  center(nearest(), true);                         // settle onto a plaque
  setTimeout(() => { dragged = false; }, 50);      // swallow the click that follows a drag
}
rail.addEventListener("pointerup", endDrag);
rail.addEventListener("pointercancel", endDrag);
rail.addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // trackpad horizontal swipes scroll natively
  e.preventDefault(); rail.scrollLeft += e.deltaY;
}, { passive: false });

function nearest() {
  const mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0, dist = Infinity;
  slots.forEach((s, i) => {
    const c = s.offsetLeft + s.offsetWidth / 2;
    if (Math.abs(c - mid) < dist) { dist = Math.abs(c - mid); best = i; }
  });
  return best;
}
function center(i, smooth) {
  i = Math.max(0, Math.min(WORKS.length - 1, i));
  const s = slots[i];
  rail.scrollTo({ left: s.offsetLeft + s.offsetWidth / 2 - rail.clientWidth / 2, behavior: smooth ? "smooth" : "auto" });
}
document.getElementById("prev").addEventListener("click", () => { unflip(); center(nearest() - 1, true); });
document.getElementById("next").addEventListener("click", () => { unflip(); center(nearest() + 1, true); });
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft")  { unflip(); center(nearest() - 1, true); }
  if (e.key === "ArrowRight") { unflip(); center(nearest() + 1, true); }
  if (e.key === "Escape") unflip();
});
let tick = null;
rail.addEventListener("scroll", () => {
  if (tick) return;
  tick = requestAnimationFrame(() => {
    tick = null;
    document.querySelector("#counter b").textContent = String(nearest() + 1).padStart(2, "0");
  });
});
</script>
</body>
</html>
