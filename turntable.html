<style>
:root {
  --black: #0a0a0c;
  --white: #fafafa;
  --accent: #ff3366;
  --gray: #888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--black);
  color: var(--white);
  overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
header {
  position: relative; z-index: 3;
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding: 1.1rem 2rem .8rem;
  border-bottom: 2px solid var(--accent);
  background: rgba(10,10,12,.85);
}
h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: .12em; line-height: 1; font-weight: 400; }
h1 em { font-style: normal; color: var(--accent); }
.modes { margin-top: .35rem; font-size: .56rem; letter-spacing: .24em; color: var(--gray); text-transform: uppercase; }
.modes a { color: var(--gray); text-decoration: none; border-bottom: 1px dotted #444; }
.modes a:hover { color: var(--accent); }
.modes b { color: var(--white); font-weight: 600; }
.ig { font-size: .66rem; letter-spacing: .14em; color: var(--white); text-decoration: none;
  border: 1px solid #333; border-radius: 999px; padding: .5rem 1rem; white-space: nowrap; transition: all .2s; }
.ig:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(255,51,102,.25); }

main { position: relative; z-index: 4; flex: 1; min-height: 0; } /* above the footer, so the bottom sheet paints (and clicks) over it */
#scene { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

/* now-playing panel: right dock on desktop, bottom sheet on phones */
#panel {
  position: absolute; right: 16px; top: 14px; z-index: 5; width: 380px;
  display: none; flex-direction: column; gap: .55rem;
  background: rgba(12,12,15,.82); backdrop-filter: blur(8px);
  border: 1px solid #26262e; border-radius: 14px; padding: .9rem;
}
#panel.on { display: flex; } /* the panel only exists while a record is out */
#np-head { display: flex; align-items: center; justify-content: space-between; gap: .7rem; cursor: pointer; }
#np-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.25rem; letter-spacing: .1em; line-height: 1.05; min-height: 1.2rem; }
#np-credit { font-size: .52rem; letter-spacing: .16em; color: var(--gray); text-transform: uppercase; margin-top: .15rem; }
#np-chevron { display: none; color: var(--gray); font-size: .8rem; transition: transform .35s; padding: .3rem; }
#embed { width: 100%; height: 152px; border-radius: 10px; overflow: hidden; transition: height .3s; }
#embed:empty { display: none; }
#embed iframe { display: block; width: 100%; height: 100%; border: 0; }
#np-actions { display: flex; gap: .45rem; align-items: stretch; }
#np-actions button {
  font: inherit; font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
  color: var(--white); background: none; border: 1px solid #3a3a42; border-radius: 999px; padding: .5rem .9rem; transition: all .2s;
}
#np-actions button:hover { border-color: var(--accent); color: var(--accent); }
#np-actions .grow { flex: 1; }
/* ✕ out of a locked camera — back to the room */
#closeview {
  position: fixed; right: 16px; top: 84px; z-index: 6;
  width: 42px; height: 42px; display: none; align-items: center; justify-content: center;
  font: inherit; font-size: .85rem; line-height: 1; cursor: pointer;
  color: var(--white); background: rgba(12,12,15,.72); backdrop-filter: blur(4px);
  border: 1px solid #333; border-radius: 999px; transition: all .2s;
}
#closeview:hover { border-color: var(--accent); color: var(--accent); }
body[data-mode="crate"] #closeview, body[data-mode="deck"] #closeview { display: flex; }
@media (min-width: 721px) {
  body[data-mode="deck"] #closeview { right: 412px; } /* clear of the docked panel */
}
body[data-mode="crate"] #envbtn, body[data-mode="deck"] #envbtn { display: none; }
body[data-mode="deck"] #browse { display: none; }
/* browse bar: flip through the crate without touching the 3d */
#browse {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 6;
  display: flex; gap: .5rem;
}
#browse button {
  font: inherit; font-size: .85rem; line-height: 1; cursor: pointer;
  width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--white); background: rgba(12,12,15,.72); backdrop-filter: blur(4px);
  border: 1px solid #333; border-radius: 999px; transition: all .2s;
}
#browse button:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(255,51,102,.25); }

footer { position: relative; z-index: 3; text-align: center; font-size: .52rem; letter-spacing: .22em; color: #55525c; padding: .5rem 1rem .7rem; text-transform: uppercase; background: rgba(10,10,12,.85); }
footer a { color: #8a8792; text-decoration: none; }
footer a:hover { color: var(--accent); }

#fail { position: absolute; inset: 0; z-index: 4; display: none; align-items: center; justify-content: center; text-align: center;
  font-size: .7rem; letter-spacing: .12em; line-height: 2; color: var(--gray); padding: 2rem; }
#fail a { color: var(--accent); }

#envbtn {
  position: fixed; left: 16px; bottom: 14px; z-index: 6;
  font: inherit; font-size: .56rem; letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
  color: var(--white); background: rgba(12,12,15,.72); backdrop-filter: blur(4px);
  border: 1px solid #333; border-radius: 999px; padding: .55rem 1.05rem; transition: all .2s;
}
#envbtn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(255,51,102,.25); }
@media (max-width: 720px) {
  #envbtn { bottom: auto; top: 82px; left: 10px; } /* the panel owns the bottom on phones */
}

@media (max-width: 720px) {
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto;
    border-radius: 16px 16px 0 0; border-left: none; border-right: none; border-bottom: none;
    padding: .65rem .9rem calc(.65rem + env(safe-area-inset-bottom));
    transition: transform .35s ease;
  }
  #panel.min { transform: translateY(calc(100% - 62px)); } /* slide down to a mini bar; the iframe stays alive */
  #panel.min #np-chevron { transform: rotate(180deg); }
  #np-chevron { display: block; }
  #np-title { font-size: 1.1rem; }
  #panel.on ~ #browse { bottom: 76px; } /* a record is out — the mini bar owns the very bottom */
  #closeview { right: 10px; top: 82px; }
  header { padding: .9rem 1.1rem .65rem; }

const B = BABYLON;
const ACCENT = new B.Color3(1, 0.2, 0.4);

/* ---- spotify: one controller in the panel, loadUri per record ----
   play() must run INSIDE the tap's gesture window or phones refuse autoplay —
   so the controller is warmed up on the first touch and every choose plays immediately */
let IFA = null, controller = null, ctlPending = false, ctlQueued = null;
let paused = true, progress = 0, posMs = 0, posAt = 0;
window.onSpotifyIframeApiReady = (api) => { IFA = api; };
function ensureController(w, then) {
  const uri = `spotify:${w.kind}:${w.id}`;
  if (controller) { controller.loadUri(uri); if (then) then(); return; } // same gesture, no timers
  if (ctlPending) { ctlQueued = { uri, then }; return; } // creation in flight — remember the latest ask
  if (!IFA) { // api blocked — plain embed; the deck still spins to its own start/stop
    document.getElementById("embed").innerHTML =
      `<iframe src="https://open.spotify.com/embed/${w.kind}/${w.id}?theme=0" loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    return;
  }
  ctlPending = true;
  const host = document.createElement("div");
  document.getElementById("embed").appendChild(host);
  IFA.createController(host, { uri, width: "100%", height: 152 }, (c) => {
    controller = c;
    c.addListener("ready", () => {
      ctlPending = false;
      if (ctlQueued) { const q = ctlQueued; ctlQueued = null; if (q.uri !== uri) c.loadUri(q.uri); if (q.then) q.then(); }
      else if (then) then();
    });
    c.addListener("playback_update", (e) => {
      paused = !!e.data.isPaused;
      document.getElementById("bplay").textContent = paused ? "▶" : "❚❚";
      if (e.data.duration) progress = e.data.position / e.data.duration;
      posMs = e.data.position; posAt = performance.now(); // the light show phase-locks to this
    });
  });
}
// the first touch of anything builds the player while nobody's looking
window.addEventListener("pointerdown", () => { if (!controller && !ctlPending && IFA) ensureController(WORKS[0]); },
  { once: true, capture: true });

/* ---- the scene ---- */
let engine, scene;

  engine = new B.Engine(document.getElementById("scene"), true, { adaptToDeviceRatio: true });
  scene = new B.Scene(engine);
} catch (e) {
  document.getElementById("fail").style.display = "flex";
  throw e;
}
scene.clearColor = B.Color4.FromHexString("#0a0a0cff");

function needleAt(yaw) { // where the stylus lands for a given arm yaw
  return { x: PIVOT.x - ARM_L * Math.cos(yaw), z: PIVOT.z + ARM_L * Math.sin(yaw) };
}
function solveYaw(radius) { // yaw that puts the needle `radius` from the platter centre (front solution)
  let best = 0, bestD = 1e9;
  for (let a = -1.2; a <= 1.2; a += 0.002) {
    const n = needleAt(a);
    const d = Math.abs(Math.hypot(n.x - PLATTER.x, n.z - PLATTER.z) - radius);
    if (d < bestD && n.z < PLATTER.z + 0.05) { bestD = d; best = a; } // prefer the arm reaching over the front
  }
  return best;
}

  g.fillText(text, 128, 68);

  m.diffuseTexture = t; m.emissiveColor = new B.Color3(0.22, 0.23, 0.26); m.specularColor = B.Color3.Black();
  const p = B.MeshBuilder.CreatePlane("lp" + text, { width: w, height: h }, scene);

}

const riser = B.MeshBuilder.CreateBox("riser", { width: 3.3, height: 0.14, depth: 1.5 }, scene);
riser.position.set(0, 0.07, 1.58); riser.material = woodDkM; riser.receiveShadows = true;

const LEAN = 0.16;   // resting lean-back, shoulder to shoulder
const DIG = -0.62;   // flipped forward over the front wall while you dig past
const DZ = 0.062;    // sleeve-to-sleeve spacing
const sleeves = [];
function buildCrate(x, yaw, works, offset) {
  const depth = works.length * DZ + 0.46; // room up front for the flipped stack to rest
  const root = new B.TransformNode("crate" + offset, scene);
  root.position.set(x, 0.14, 1.60); root.rotation.y = yaw;
  const wall = (name, w, h, d, px, py, pz, m) => {
    const b = B.MeshBuilder.CreateBox(name + offset, { width: w, height: h, depth: d }, scene);
    b.parent = root; b.position.set(px, py, pz); b.material = m; b.receiveShadows = true;
    return b;
  };
  wall("cbottom", 0.78, 0.05, depth, 0, 0.025, 0, woodDkM);
  wall("cleft", 0.05, 0.5, depth, -0.415, 0.25, 0, woodM);
  wall("cright", 0.05, 0.5, depth, 0.415, 0.25, 0, woodM);
  wall("cfront", 0.78, 0.34, 0.05, 0, 0.17, -depth / 2 + 0.025, woodM);
  wall("cback", 0.78, 0.44, 0.05, 0, 0.22, depth / 2 - 0.025, woodM);
  const crate = { root, focus: -1, sleeves: [] };
  root.getChildMeshes().forEach((m) => { m.metadata = { ctl: "cratebox", crate }; }); // the box itself is the invitation — tap it to step up
  const z0 = -depth / 2 + 0.34; // first record stands clear of the front wall so the dug stack can rest over it
  works.forEach((w, k) => {
    const fuv = []; // art on both faces; edges sample the middle of the art so nothing smears
    for (let f = 0; f < 6; f++) fuv[f] = new B.Vector4(0.48, 0.48, 0.52, 0.52);
    fuv[0] = new B.Vector4(0, 0, 1, 1); fuv[1] = new B.Vector4(0, 0, 1, 1); // babylon draws each face unmirrored from outside — no flipping
    const s = B.MeshBuilder.CreateBox("sleeve" + (offset + k), { width: 0.6, height: 0.6, depth: 0.018, faceUV: fuv }, scene);
    s.position.y = 0.3; s.bakeCurrentTransformIntoVertices(); // pivot at the bottom edge, like a record standing on it
    s.parent = root; s.position.set(0, 0.055, z0 + k * DZ);
    s.rotation.x = LEAN;
    const m = new B.StandardMaterial("sm" + (offset + k), scene);
    m.diffuseTexture = new B.Texture(w.artLocal, scene);
    m.specularColor = new B.Color3(0.04, 0.04, 0.04);
    s.material = m;
    s.metadata = { ctl: "sleeve", i: offset + k, crate, k };
    s._lean = LEAN; s._lift = 0;
    shadows.addShadowCaster(s);
    crate.sleeves.push(s); sleeves.push(s);
  });
  return crate;
}

/* ---- state ---- */
let current = -1;          // record on the platter
let angle = 0, rpm = 0;
let ritual = null;         // {phase, t, i}

const npCredit = document.getElementById("np-credit");

function chooseRecord(i) {
  if (ritual || i === current) return;
  if (current >= 0) putBack(true);
  const w = WORKS[i];
  tLabelM.diffuseTexture?.dispose();
  tLabelM.diffuseTexture = new B.Texture(w.artLocal, scene);
  const s = sleeves[i];
  s.metadata.crate.focus = s.metadata.k; // everything in front flips forward out of the way
  ritual = { phase: "pull", t: 0, i, yaw: s.metadata.crate.root.rotation.y };
  ensureController(w, () => { controller && controller.play(); }); // play NOW, inside the tap — the song starts as the record flies
  enterDeck(); // the camera drifts over to watch it land
}
function landRecord(i) {
  const w = WORKS[i];
  current = i;
  labelM.diffuseTexture?.dispose();
  labelM.diffuseTexture = new B.Texture(w.artLocal, scene);
  vinyl.setEnabled(true); label.setEnabled(true);
  beatPos = 0; posAt = 0; // fresh beat grid for the new record
  sleeves.forEach((s, j) => { s.visibility = j === i ? 0.28 : 1; });
  npTitle.textContent = w.title;
  npCredit.textContent = w.credit;
  document.getElementById("embed").style.height = (w.kind === "album" ? 352 : 152) + "px"; // albums show the whole tracklist
  panel.classList.add("on"); panel.classList.remove("min");
  progress = 0; armTarget = YAW_IN;
}
function putBack(quick) {
  if (current < 0) return;
  sleeves[current].visibility = 1;
  current = -1;
  vinyl.setEnabled(false); label.setEnabled(false);
  armTarget = YAW_REST; progress = 0;
  if (controller) try { controller.pause(); } catch (e) {}
  paused = true;
  bplay.textContent = "▶";
  if (!quick) { panel.classList.remove("on"); toRoom(); }
}

/* ---- three camera moods: roam the room, lean into a crate, hang over the deck ---- */

    target: new B.Vector3(p.x, p.y + 0.30, p.z), ox: 0, oy: portrait() ? 0.1 : 0 };
}

    ? { alpha: -Math.PI / 2, beta: 0.52, radius: 5.0, target: new B.Vector3(p.x, 0.1, p.z), ox: 0, oy: 0.72 }
    : { alpha: -Math.PI / 2, beta: 0.58, radius: 3.6, target: new B.Vector3(p.x, 0.1, p.z), ox: 0.9, oy: 0 };
}
function enterCrate(c) {
  mode = "crate"; curCrate = c;
  document.body.dataset.mode = "crate";
  cam.detachControl(); freeLimits();
  if (c.focus < 0) setFocus(c.sleeves[0].metadata.i); // walk in facing the front of the stack
  panel.classList.add("min"); // listening? the sheet ducks out of the way
  camTo(viewCrate(c), 0.8);
}

  document.body.dataset.mode = "deck";

}

  document.body.dataset.mode = "room";
  for (const c of crates) c.focus = -1; // records settle back down

  camTo(viewRoom(), 0.85, true);

/* ---- picking: taps for buttons + sleeves + crates, a drag for the pitch fader, swipes to dig ---- */
let faderDrag = false, focusIdx = -1;
const swipe = { on: false, x: 0 };
scene.onPointerObservable.add((pi) => {
  const pick = pi.pickInfo;
  if (pi.type === B.PointerEventTypes.POINTERDOWN) {
    if (pick?.hit && pick.pickedMesh?.metadata?.ctl === "pitch") {
      faderDrag = true; cam.detachControl();
    } else if (mode === "crate") {
      swipe.on = true; swipe.x = pi.event.clientX; // a finger on the crate view digs by swiping
    }
  }
  if (pi.type === B.PointerEventTypes.POINTERUP) {
    swipe.on = false;
    if (faderDrag) {
      faderDrag = false;
      if (mode === "room") cam.attachControl(document.getElementById("scene"), true);
    }
  }
  if (pi.type === B.PointerEventTypes.POINTERMOVE) {
    if (faderDrag) {
      const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, B.Matrix.Identity(), cam);
      if (Math.abs(ray.direction.y) > 1e-4) {
        const t = (0.246 - ray.origin.y) / ray.direction.y;
        let z = ray.origin.z + ray.direction.z * t - deckRoot.position.z - grpPitch.position.z; // fader lives on its sled
        z = Math.max(-PITCH_HALF, Math.min(PITCH_HALF, z));
        knob.position.z = z;
        pitch = (-z / PITCH_HALF) * 8; // push away = slower, pull close = faster
      }
      return;
    }
    if (swipe.on && mode === "crate" && !ritual) {
      const dx = pi.event.clientX - swipe.x;
      if (Math.abs(dx) > 46) { step(dx < 0 ? 1 : -1); swipe.x = pi.event.clientX; } // keep dragging, keep digging
      return;
    }
    // hover (mouse): the record under the cursor becomes the dig point
    if (pi.event.pointerType === "mouse" && !ritual && mode !== "deck") {
      const h = scene.pick(scene.pointerX, scene.pointerY, (m) => m.metadata?.ctl === "sleeve");
      if (h?.hit) { const md = h.pickedMesh.metadata; md.crate.focus = md.k; focusIdx = md.i; }
    }
  }
  if (pi.type === B.PointerEventTypes.POINTERTAP && pick?.hit && pick.pickedMesh?.metadata) {
    const md = pick.pickedMesh.metadata;
    if (md.ctl === "sleeve" || md.ctl === "cratebox") {
      const crate = md.crate;
      if (mode !== "crate" || crate !== curCrate) {
        if (md.ctl === "sleeve") { crate.focus = md.k; focusIdx = md.i; }
        enterCrate(crate);                                 // first tap walks you up to the crate
      } else if (md.ctl === "sleeve") {
        if (crate.focus === md.k) chooseRecord(md.i);      // tap the record facing you = pull it
        else { crate.focus = md.k; focusIdx = md.i; }      // tap deeper in the crate = flip to it
      }
    }
    if (md.ctl === "startstop" && current >= 0 && controller) controller.togglePlay();
    if (md.ctl === "rpm33") setRPM(100 / 3);
    if (md.ctl === "rpm45") setRPM(45);
  }
});

/* ---- browse bar + panel actions ---- */
const N = WORKS.length;
function setFocus(i) {
  focusIdx = ((i % N) + N) % N;
  for (const c of crates) c.focus = -1;
  const md = sleeves[focusIdx].metadata;
  md.crate.focus = md.k;
  if (mode === "crate" && md.crate !== curCrate) { curCrate = md.crate; camTo(viewCrate(curCrate), 0.7); } // the dig walks across to the other crate
}
function step(dir) {
  if (ritual) return;
  if (current >= 0 && mode !== "crate") chooseRecord(((current + dir) % N + N) % N); // playing: skip straight to the next record
  else setFocus(focusIdx < 0 ? (dir > 0 ? 0 : N - 1) : focusIdx + dir);
}
document.getElementById("bprev").addEventListener("click", () => step(-1));
document.getElementById("bnext").addEventListener("click", () => step(1));
bplay.addEventListener("click", () => {
  if (ritual) return;
  if (current >= 0) { if (controller) controller.togglePlay(); }
  else chooseRecord(focusIdx < 0 ? 0 : focusIdx);
});
document.getElementById("skipb").addEventListener("click", () => { if (!ritual && current >= 0) chooseRecord(((current - 1) % N + N) % N); });
document.getElementById("skipf").addEventListener("click", () => { if (!ritual && current >= 0) chooseRecord(((current + 1) % N + N) % N); });
document.getElementById("digb").addEventListener("click", () => enterCrate(curCrate || crates[0])); // browse while it plays

  else toRoom();
});
window.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); if (current >= 0 && controller) controller.togglePlay(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === "Escape") { if (mode === "crate") toRoom(); else putBack(false); }
});

/* ---- the loop: motor physics, arm tracking, the ritual ---- */
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let roomT = 0, partyAmt = 0, beatPos = 0;
scene.onBeforeRenderObservable.add(() => {
  const dt = Math.min(0.05, engine.getDeltaTime() / 1000);
  roomT += dt;

  // the camera glides between its moods
  if (camAnim.on) {
    camAnim.t += dt;
    const k = ease(Math.min(1, camAnim.t / camAnim.dur));
    const f = camAnim.from, v = camAnim.to;
    cam.alpha = f.alpha + (v.alpha - f.alpha) * k;
    cam.beta = f.beta + (v.beta - f.beta) * k;
    cam.radius = f.radius + (v.radius - f.radius) * k;
    cam.target.copyFrom(B.Vector3.Lerp(f.target, v.target, k)); // mutate in place — the target SETTER would recompute alpha/beta/radius and fight us
    cam.targetScreenOffset.set(f.ox + (v.ox - f.ox) * k, f.oy + (v.oy - f.oy) * k);
    if (camAnim.t >= camAnim.dur) {
      camAnim.on = false;
      if (camAnim.thenAttach) { roomLimits(); cam.attachControl(document.getElementById("scene"), true); }
    }
  }

  // the cat breathes, slowly, because it is asleep and life is good
  catBody.scaling.y = 0.145 + Math.sin(roomT * 1.5) * 0.006;

  // platter: motor spin-up, lazy spin-down, pitch rides it
  const spinning = current >= 0 && !paused;
  const target = spinning ? baseRPM * (1 + pitch / 100) : 0;
  rpm += (target - rpm) * Math.min(1, dt * 2.4);
  if (!spinning && Math.abs(rpm) < 0.05) rpm = 0;
  angle += rpm * 0.10472 * dt; // rpm → rad/s
  spin.rotation.y = angle;

  // led honest to actual playback
  ledM.emissiveColor = spinning ? ACCENT : B.Color3.Black();

  // the show eases in while the record plays, phase-locked to playback position
  partyAmt += ((spinning ? 1 : 0) - partyAmt) * Math.min(1, dt * 1.8);
  if (spinning) {
    if (controller && posAt) beatPos = (posMs + performance.now() - posAt) / 1000;
    else beatPos += dt; // plain-embed fallback free-runs the grid
  }
  if (partyAmt > 0.01) {
    const bpm = (current >= 0 && WORKS[current].bpm) || 120;
    const beat = beatPos * bpm / 60;
    const kick = Math.pow(Math.max(0, 1 - (beat % 1)), 2.4);        // hits on the beat, decays fast
    const off = Math.pow(Math.max(0, 1 - ((beat + 0.5) % 1)), 2.4); // the offbeat answer
    const bar = Math.floor(beat / 4);
    partyA.diffuse = B.Color3.FromHSV((bar * 47) % 360, 0.85, 1);
    partyB.diffuse = B.Color3.FromHSV((bar * 47 + 160) % 360, 0.85, 1);
    partyA.intensity = partyAmt * (0.18 + 1.5 * kick);
    partyB.intensity = partyAmt * (0.18 + 1.5 * off);
    sweep.diffuse = B.Color3.FromHSV((bar * 47 + 80) % 360, 0.7, 1);
    sweep.intensity = partyAmt * (0.4 + 1.1 * Math.pow(Math.max(0, 1 - ((beat * 0.5) % 1)), 2));
    sweep.direction = new B.Vector3(Math.sin(beat * Math.PI / 4) * 0.8, -0.15, 1).normalize();
    pink.intensity = 0.75 + partyAmt * 1.1 * kick;
    glow.intensity = 0.6 + partyAmt * 0.5 * kick;
    for (const w of woofers) w.scaling.setAll(1 + partyAmt * 0.16 * (w._side ? off : kick));
  } else {
    partyA.intensity = 0; partyB.intensity = 0; sweep.intensity = 0;
    pink.intensity = 0.75; glow.intensity = 0.6;
    for (const w of woofers) w.scaling.setAll(1);
  }
  // house lights ease down when the show is on
  key.intensity = 1.45 - 0.55 * partyAmt;
  hemi.intensity = 0.52 - 0.16 * partyAmt;
  fill.intensity = 0.4 - 0.25 * partyAmt;

  // arm rides the groove
  if (current >= 0 && armTarget !== YAW_REST) {
    armTarget = YAW_IN + (YAW_OUT - YAW_IN) * Math.min(1, Math.max(0, progress));
  }
  armCur += (armTarget - armCur) * Math.min(1, dt * 3);
  armYaw.rotation.y = armCur;

  // the dig: records in front of the focus flip forward, the focus stands up to meet you
  for (const c of crates) for (let k = 0; k < c.sleeves.length; k++) {
    const s = c.sleeves[k];
    let lean = LEAN, lift = 0;
    if (c.focus >= 0) {
      if (k < c.focus) lean = DIG;
      else if (k === c.focus) { lean = 0.05; lift = 0.16; }
    }
    if (ritual && ritual.i === s.metadata.i && ritual.phase === "pull") { lean = 0.02; lift = 0.5; }
    s._lean += (lean - s._lean) * Math.min(1, dt * 9);
    s._lift += (lift - s._lift) * Math.min(1, dt * 8);
    s.rotation.x = s._lean;
    s.position.y = 0.055 + s._lift;
  }

  // the ritual: pull → eject → fly → land
  if (ritual) {
    ritual.t += dt;
    const s = sleeves[ritual.i];
    if (ritual.phase === "pull" && ritual.t > 0.5) {
      ritual.phase = "eject"; ritual.t = 0;
      travel.setEnabled(true);
      travel.position = s.getAbsolutePosition().clone();
      travel.position.y += 0.42; // sliding up out of the raised sleeve
      travel.rotation.set(Math.PI / 2 - 0.05, ritual.yaw, 0);
      travel.scaling.setAll(0.85);
    } else if (ritual.phase === "eject") {
      travel.position.y += dt * 1.1;
      if (ritual.t > 0.35) { ritual.phase = "fly"; ritual.t = 0; ritual.from = travel.position.clone(); }
    } else if (ritual.phase === "fly") {
      const k = ease(Math.min(1, ritual.t / 0.75));
      const dest = new B.Vector3(PLATTER.x + deckRoot.position.x, PLATTER.y + 0.06, PLATTER.z + deckRoot.position.z);
      travel.position = B.Vector3.Lerp(ritual.from, dest, k);
      travel.position.y += Math.sin(k * Math.PI) * 0.55;                 // an arc over the deck, not a slide
      travel.rotation.x = (Math.PI / 2 - 0.05) * (1 - k);                // lays itself flat
      travel.rotation.y = ritual.yaw * (1 - k) + k * 2.2;                // lazy spin on the way over
      const sc = 0.85 + 0.15 * k; travel.scaling.setAll(sc);
      if (ritual.t >= 0.78) {
        travel.setEnabled(false);
        landRecord(ritual.i);
        ritual = null;
      }
    }
  }
});
engine.runRenderLoop(() => scene.render());
function frameCamera() { // portrait keeps the vertical fov — reframe whatever we're looking at
  if (mode === "room") {
    const v = viewRoom();
    cam.radius = v.radius; cam.target.copyFrom(v.target); cam.targetScreenOffset.set(0, 0);
  } else if (mode === "crate" && curCrate) camTo(viewCrate(curCrate), 0.4);
  else if (mode === "deck") camTo(viewDeck(), 0.4);
}
frameCamera();
window.addEventListener("resize", () => { engine.resize(); frameCamera(); });

/* debug hooks, same spirit as the bedroom */
window.METRO_TT = { scene, engine, cam, chooseRecord, putBack, setRPM, crates, deckRoot, setFocus, step,
  enterCrate, enterDeck, toRoom,
  demo: (on) => { paused = !on; }, // pretend playback for testing the show without audio
  get state() { return { current, rpm, pitch, paused, progress, armCur, mode, YAW_IN, YAW_OUT, YAW_REST }; } };
</script>
